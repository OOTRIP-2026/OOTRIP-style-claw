const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.info}"/></svg>`, $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaults={name:'我的衣橱',height:'160',size:'M',language:'简体中文',clothesSort:'最近添加',outfitSort:'穿着率优先',reminder:false,sync:false,memories:['喜欢休闲风格','不喜欢紧身服装','偏爱米色和低饱和配色','日常搭配优先选择平底鞋'],entries:[{date:'2026-10-09',note:'轻盈的秋日，刚刚好的温柔。'}]};let state;try{state={...structuredClone(defaults),...JSON.parse(localStorage.getItem('ootrip')||'{}')}}catch{state=structuredClone(defaults)}let current='home',tab='home',stack=[];function save(){try{localStorage.setItem('ootrip',JSON.stringify(state))}catch{toast('当前浏览器无法保存本地数据')}}
function row(s,a='',i='',v=''){return `<button class="row" data-action="${a}">${i?`<span class="tile">${icon(i)}</span>`:''}<span class="grow">${s}</span>${v?`<span class="value">${esc(v)}</span>`:''}<span class="chev">›</span></button>`}const group=s=>`<div class="group">${s}</div>`,label=s=>`<div class="label">${s}</div>`,head=s=>`<header><button data-action="back" aria-label="返回">${icon('back')}</button><h1>${s}</h1><span></span></header>`;function toggle(k,s){return `<div class="row"><span class="grow">${s}</span><button role="switch" aria-label="${s}" aria-checked="${state[k]}" class="switch ${state[k]?'on':''}" data-action="toggle:${k}"></button></div>`}function choice(k,opts){return group(opts.map(s=>`<button class="row" data-action="choose:${k}:${s}"><span>${s}</span>${state[k]===s?'<span class="check">✓</span>':''}</button>`).join(''))}

function content(id){switch(id){case'home':return `<div class="profile"><div class="profile-portrait"><button class="avatar" data-action="editProfile" aria-label="编辑个人资料"><img class="reference-portrait" src="assets/profile-reference.png" alt="我的头像"></button><button class="profile-gift" data-action="go:membership" aria-label="查看会员权益">${icon('gift')}</button></div><h1>${esc(state.name)}</h1></div><section class="home-section">${label('常用功能')}<div class="quick"><button data-action="go:profile"><img src="assets/garment-views/07-front.png" alt="">穿搭档案</button><button data-action="go:journal"><img class="quick-bag" src="assets/outfit-cutout-5.png" alt="">穿搭手账</button></div></section><section class="home-section">${label('帮助')}${group(row('使用说明','go:help','book'))}</section><section class="home-section">${label('设置')}${group(row('账户与权益','go:account','account')+row('穿着记录提醒','go:reminder','bell')+row('语言','go:language','globe')+row('排序偏好','go:sorting','sort')+row('数据管理','go:data','cloud')+row('关于','go:about','info'))}</section>`;
case'help':return head('使用说明')+group(row('修改出行信息','editTrip','hanger'))+`<div class="help-copy"><h2>整理你的衣橱</h2><p>进入底部「衣橱」，悬停衣物查看正面，拖动衣杆左右浏览。点击加号可以添加自己的衣物。</p><h2>记录一套穿搭</h2><p>进入「旅行」，点击新增穿搭或日期卡片中的加号，按顺序选择衣物，调整搭配后保存。</p><h2>留下穿衣灵感</h2><p>在「穿搭档案」中保存尺码与喜好，在「穿搭手账」中记录每天的穿搭和心情。</p><h2>保存你的数据</h2><p>在「数据管理」中导出备份，换设备前请妥善保存备份文件。</p></div>`;
case'profile':return head('穿衣档案')+label('个人档案')+group(`<button class="row" data-action="editProfile"><div class="stats grow"><div><span class="small">身高</span><b>${esc(state.height)} <small style="font-size:12px">cm</small></b></div><div><span class="small">常穿尺码</span><b>${esc(state.size)}</b></div></div><span class="chev">›</span></button>`+row('身型备注','detail:身型备注','',state['身型备注']||'点击填写')+row('我的穿衣时间','detail:我的穿衣时间','','日常通勤')+row('更多身体数据','detail:更多身体数据','','肩宽 / 腰围 / 臀围'))+label('穿衣偏好')+group(row('喜欢的风格','detail:喜欢的风格','',state['喜欢的风格']||'休闲、自然')+row('不喜欢的搭配','detail:不喜欢的搭配','',state['不喜欢的搭配']||'紧身、繁复')+row('AI 记忆','go:memory'))+label('色彩偏好')+group(row('喜欢色','detail:喜欢色','',state['喜欢色']||'米色、燕麦色')+row('不喜欢色','detail:不喜欢色','',state['不喜欢色']||'暂无'));

case'journal':return head('穿衣手账')+`<button class="primary" data-action="record">记录今天穿搭</button>`+state.entries.map((e,i)=>`${i===0||e.date.slice(0,7)!==state.entries[i-1].date.slice(0,7)?`<p class="date">${e.date.slice(0,4)}年${Number(e.date.slice(5,7))}月</p>`:''}<button class="row" data-action="entry:${e.date}" style="padding:12px 0;align-items:start"><div><span class="day">${Number(e.date.slice(-2))}</span><span class="small">${new Date(e.date+'T12:00:00').toLocaleDateString('zh-CN',{weekday:'short'})}</span><div class="dots"><i></i><i></i></div></div><div class="clothes"><div class="cloth">${icon('shirt')}</div><div class="cloth">${icon('pants')}</div></div></button>`).join('')+(state.entries.length?'':'<p class="notice">记录第一套穿搭，留住今天的好心情。</p>');
case'account':return head('账户与权益')+label('账户')+group(row('Apple 账户','accountInfo','','未登录')+row('已授权设备','devices','','此设备'))+label('会员与权益')+group(row('灵感会员','go:membership','crown')+row('剩余点数','points','star','12')+row('AI 使用说明','aiInfo','info')+row('恢复购买','restore','bag'))+label('账户管理')+group(row('退出登录','logout'))+label('账号与安全')+group(row('注销账号','deleteAccount','trash'));
case'reminder':return head('穿着记录提醒')+`<p class="small">每天轻轻提醒，记录属于你的穿搭时光。</p>`+group(toggle('reminder','每日穿着记录提醒')+(state.reminder?`<div class="row"><label for="time" class="grow">提醒时间</label><input id="time" type="time" value="${esc(state.time||'20:00')}" style="border:0;background:none"></div>`:''))+`<p class="small">${state.reminder?'已保存提醒偏好；本原型不发送系统通知。':''}</p>`+art();
case'language':return head('语言')+label('语言')+choice('language',['简体中文','繁體中文','English'])+`<p class="notice">已保存语言偏好。本次原型仅实现简体中文界面。</p>`;
case'sorting':return head('排序偏好')+label('衣橱排序')+choice('clothesSort',['最近添加','最早添加','按季节'])+label('搭配组合排序')+choice('outfitSort',['穿着率优先','按分类','最近添加','按颜色']);
case'data':return head('数据管理')+label('云端同步')+group(toggle('sync','云端同步')+row('最近云端备份','backup','cloud','暂无'))+`<p class="small">数据保存在本机；云端同步为交互演示。</p>`+label('手动备份')+group(row('导出数据<br><span class="small">导出设置、偏好与手账记录</span>','export','book')+row('导入数据<br><span class="small">从 JSON 文件恢复本机数据</span>','import','book'))+group(row('删除所有本地数据<br><span class="small">删除后无法恢复，请先备份</span>','clear','trash'));
case'about':return head('关于')+`<div class="brand"><div class="owl">🦉</div><h2>OOTRIP</h2><p>衣橱里的每件衣服<br>都值得被好好穿着<br><span class="small">版本 1.0.0 · 交互原型</span></p></div>`+group(row('隐私政策','article:隐私政策')+row('服务条款','article:服务条款')+row('用户反馈','feedback')+row('给我们评分','rate'));

case'wardrobe':return head('我的衣橱')+`<p class="small">日常衣物 · 示例衣橱</p><div class="cards">`+['shirt','pants','shoe'].map((c,i)=>`<button data-action="cloth:${i}"><div class="cloth">${icon(c)}</div><p>${['燕麦色衬衫','奶油白长裤','日常平底鞋'][i]}</p></button>`).join('')+`</div>`;
case'travel':return head('旅行衣橱')+`<div class="brand">${icon('hanger')}<h2>下一站，穿什么？</h2><p>把目的地与好心情，一起装进行李箱。</p></div><button class="primary" data-action="trip">计划一次旅行</button><div style="height:18px"></div>`+(state.trip?group(row(esc(state.trip.destination),'tripView','bag',state.trip.depart)):group(row('秋日城市漫游','tripSample','bag','示例 · 3天')));}}
function render(dir='enter'){$('#view').innerHTML=`<section class="page ${dir}" data-page="${current}">${content(current)}</section>`;$('#nav').innerHTML=[['travel','hanger','AI搭配'],['wardrobe','closet','衣橱'],['home','user','我的']].map(([p,i,n])=>`<button class="${tab===p?'active':''}" data-action="tab:${p}" ${tab===p?'aria-current="page"':''}>${icon(i)}<span>${n}</span></button>`).join('')}function go(id){stack.push(current);current=id;render()}function back(){current=stack.pop()||tab;render('back')}let toastTimer;function toast(s){$('#toast').innerHTML=`<div class="toast">${esc(s)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').innerHTML='',2800)}let previousFocus;function close(){$('#modal').innerHTML='';previousFocus?.focus()}function sheet(title,body,confirm='',fn=null){previousFocus=document.activeElement;$('#modal').innerHTML=`<div class="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><h2>${title}</h2>${body}${confirm?'<button class="primary" id="confirm">'+confirm+'</button>':''}<button class="secondary" data-action="close">关闭</button></section></div>`;if(fn)$('#confirm').onclick=fn;$('#modal').querySelector('input,button')?.focus()}function field(n,id,v='',type='text'){return `<label class="field">${n}<input id="${id}" type="${type}" value="${esc(v)}"></label>`}
document.addEventListener('change',e=>{if(e.target.id==='time'){state.time=e.target.value;save();toast('提醒时间已保存')}});document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'&&$('#modal').firstChild){const nodes=[...$('#modal').querySelectorAll('button,input,select,textarea')],first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.addEventListener('click',e=>{if(e.target.classList.contains('overlay'))return close();const b=e.target.closest('[data-action]');if(!b)return;const[a,k,...rest]=b.dataset.action.split(':'),v=rest.join(':');switch(a){case'editTrip':parent.postMessage({type:'ootrip:edit-trip'},'*');break;case'go':if(k==='journal'&&window.self!==window.top){parent.postMessage({type:'ootrip:open-module',module:'journal'},location.protocol==='file:'?'*':location.origin)}else go(k);break;case'back':back();break;case'tab':tab=k;current=k;stack=[];render();break;case'close':close();break;case'toggle':state[k]=!state[k];save();render('');if(k==='sync'&&state[k])toast('云端同步仅为交互演示');break;case'choose':state[k]=v;save();render('');toast('偏好已保存');break;
case'editProfile':sheet('编辑个人档案',field('衣橱名称','name',state.name)+field('身高（cm）','height',state.height,'number')+`<label class="field">常穿尺码<select id="size">${['XS','S','M','L','XL','XXL'].map(s=>`<option ${s===state.size?'selected':''}>${s}</option>`).join('')}</select></label>`,'保存',()=>{const h=Number($('#height').value);if(h<80||h>240)return toast('请填写 80–240 cm 的身高');state.name=$('#name').value.trim()||'我的衣橱';state.height=String(h);state.size=$('#size').value;save();close();render('');toast('个人档案已保存')});break;
case'memory':case'addMemory':sheet(a==='memory'?'编辑 AI 记忆':'添加 AI 记忆',field('穿衣偏好','memory',a==='memory'?state.memories[Number(k)]:''),'保存',()=>{const m=$('#memory').value.trim();if(!m)return toast('请填写一条偏好');a==='memory'?state.memories[Number(k)]=m:state.memories.push(m);save();close();render('');toast('记忆已更新')});break;
case'record':sheet('记录今天穿搭',field('日期','recordDate',new Date().toLocaleDateString('sv-SE'),'date')+`<div class="clothes"><div class="cloth">${icon('shirt')}</div><div class="cloth">${icon('pants')}</div></div>`+field('今日穿搭心情','note'),'保存穿搭',()=>{const d=$('#recordDate').value;if(!d)return toast('请选择日期');state.entries=state.entries.filter(e=>e.date!==d);state.entries.push({date:d,note:$('#note').value});state.entries.sort((a,b)=>b.date.localeCompare(a.date));save();close();render('');toast('穿搭已记录')});break;
case'entry':{const entry=state.entries.find(e=>e.date===k);sheet(k+' · 穿搭记录',`<div class="clothes"><div class="cloth">${icon('shirt')}</div><div class="cloth">${icon('pants')}</div></div><p>${esc(entry?.note||'今天也有认真穿搭。')}</p>`,'删除这条记录',()=>{state.entries=state.entries.filter(e=>e.date!==k);save();close();render('');toast('记录已删除')});break}
case'detail':sheet(k,field(k,'detail',state[k]||''),'保存',()=>{state[k]=$('#detail').value;save();close();render('');toast('已保存')});break;
case'export':{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),link=document.createElement('a');link.href=url;link.download='OOTRIP-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('备份已导出');break}
case'import':{const input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=async()=>{try{const d=JSON.parse(await input.files[0].text());if(!Array.isArray(d.memories)||!d.memories.every(x=>typeof x==='string')||!Array.isArray(d.entries)||!d.entries.every(x=>typeof x.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)))throw Error();state={...structuredClone(defaults),...d};save();render('');toast('数据已恢复')}catch{toast('备份格式不正确，未导入')}};input.click();break}
case'clear':sheet('删除所有本地数据','<p>将清除档案、设置与穿搭记录，此操作无法撤销。建议先导出备份。</p>','确认删除',()=>{state=structuredClone(defaults);state.entries=[];state.memories=[];save();close();render('');toast('本地数据已清除')});break;
case'backup':toast('暂无云端备份，可导出文件保存');break;case'restore':toast('演示原型没有可恢复的购买记录');break;case'purchase':toast('购买流程为演示，不会扣费');break;case'logout':toast('当前为本机体验，无需退出登录');break;case'deleteAccount':sheet('注销账号','<p>当前没有登录账号，数据保存在此浏览器。请在「数据管理」中导出或删除本地数据。</p>');break;case'accountInfo':sheet('Apple 账户','<p>当前为访客体验。Apple 登录尚未连接，所有设置仅保存在本机。</p>');break;case'devices':sheet('已授权设备','<p>当前浏览器 · 本机体验<br>暂未连接其他设备。</p>');break;case'points':sheet('剩余点数','<p>示例可用点数：12<br>本原型不提供真实 AI 调用或点数扣减。</p>');break;case'aiInfo':sheet('AI 使用说明','<p>穿衣档案与 AI 记忆用于记录你的风格偏好。本原型展示设置流程，尚未连接 AI 服务。</p>');break;
case'article':sheet(k,'<p>这是 OOTRIP 交互原型。个人档案、偏好与穿搭记录仅保存在当前浏览器，不上传服务器。</p><p>清除浏览器数据可能导致记录丢失，请在数据管理中导出备份。本原型不提供真实支付、云端同步或 AI 推理服务。</p>');break;
case'feedback':sheet('用户反馈',field('告诉我们你的想法','feedback'),'保存反馈',()=>{if(!$('#feedback').value.trim())return toast('请先填写反馈');state.feedback=$('#feedback').value;save();close();toast('反馈已保存至本机')});break;case'rate':sheet('给我们评分',`<div style="display:flex;justify-content:space-around;font-size:30px">${[1,2,3,4,5].map(n=>`<button data-action="rating:${n}" aria-label="${n}星">☆</button>`).join('')}</div>`);break;case'rating':state.rating=Number(k);save();close();toast(`已记录 ${k} 星评价，谢谢你`);break;
case'cloth':sheet(['燕麦色衬衫','奶油白长裤','日常平底鞋'][Number(k)],`<div class="cloth" style="width:100%;height:160px">${icon(['shirt','pants','shoe'][Number(k)])}</div><p>颜色：${['燕麦色','奶油白','浅棕色'][Number(k)]}<br>季节：春 / 秋<br>场景：日常、通勤</p>`);break;
case'trip':sheet('计划一次旅行',field('目的地','dest',state.trip?.destination||'')+field('出发日期','depart',state.trip?.depart||'','date')+field('返程日期','return',state.trip?.return||'','date'),'保存计划',()=>{if(!$('#dest').value||!$('#depart').value||!$('#return').value)return toast('请填写目的地和完整日期');if($('#return').value<$('#depart').value)return toast('返程日期不能早于出发日期');state.trip={destination:$('#dest').value,depart:$('#depart').value,return:$('#return').value};save();close();render('');toast('旅行计划已保存')});break;case'tripView':sheet(esc(state.trip.destination),`<p>出发：${esc(state.trip.depart)}<br>返程：${esc(state.trip.return)}</p>`);break;case'tripSample':sheet('秋日城市漫游','<p>3 天的轻装旅行<br>建议携带：衬衫、针织衫、长裤、半裙、平底鞋、外套。</p>');break;
}});render();
</script></body></html>
