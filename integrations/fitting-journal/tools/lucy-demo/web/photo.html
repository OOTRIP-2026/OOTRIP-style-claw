<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/photo.css"><meta name="lucy-experiment" content="__NONCE__"><title>照片试衣</title><link rel="stylesheet" href="/module-theme.css"></head><body>
<main class="photo-workspace" id="photo-workspace">
<section class="stage"><img id="person-preview" alt="人物原照片" hidden><button id="empty" type="button">上传人物照片</button><img id="result-preview" alt="AI照片试衣结果" hidden><button id="photo-toggle" aria-expanded="true" aria-controls="photo-wardrobe">收起选衣 ›</button><div class="stage-actions"><label class="upload">＋ 人物照片<input id="person-file" type="file" accept="image/png,image/jpeg,image/webp"></label><button id="original" hidden>查看原图</button><button id="download-photo" disabled>↓ 保存效果</button></div></section>
<aside id="photo-wardrobe"><nav id="photo-categories" class="categories" aria-label="衣物分类"></nav><section class="garment-panel"><div class="category-heading"><button id="photo-category-back" aria-label="返回分类">‹</button><span id="photo-category-title">上衣</span></div><label class="upload garment-upload">＋ 上传<input id="garment-file" type="file" accept="image/png,image/jpeg,image/webp"></label><div id="photo-garments" class="garments"></div></section></aside>
<section class="photo-controls"><p id="photo-selected"></p><div id="photo-selection" aria-label="已选试穿衣物" aria-live="polite"></div><button id="photo-start" class="primary" disabled>试穿已选衣物 ↗</button><label class="consent"><input id="photo-consent" type="checkbox">我同意将本次人物照片与选中衣服发送至阿里云百炼生成试衣照片，并消耗图像模型额度。</label><details class="service-details"><summary>服务状态 · AI效果供穿搭参考</summary><p id="photo-status" role="status">正在检查照片试衣服务…</p></details></section></main><script type="module" src="/photo.js"></script></body></html>
