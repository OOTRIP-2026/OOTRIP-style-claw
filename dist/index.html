function open(item){if(expanded&&expanded!==item){expanded.classList.remove('front-facing');expanded.setAttribute('aria-expanded','false')}expanded=item;item.classList.add('front-facing');item.setAttribute('aria-expanded','true')}
function close(item){if(expanded!==item)return;item.classList.remove('front-facing');item.setAttribute('aria-expanded','false');expanded=null}
names.forEach((name,i)=>{const libraryId='library-'+String(rowIndex*6+i+1).padStart(2,'0');if(window.OotripWardrobe&&localStorage.getItem('ootrip-wardrobe-initialized')&&!OotripWardrobe.cache.some(x=>x.id===libraryId))return;const item=document.createElement('button');item.className='hanging-garment';item.setAttribute('aria-label',name+'，悬停查看正面');item.setAttribute('aria-expanded','false');item.innerHTML='<span class="rail-hook" aria-hidden="true"><svg viewBox="0 0 16 38"><path d="M3 8C3 0 14 0 14 7c0 6-6 6-6 12v18"/></svg></span><span class="garment-turn textile-garment"><span class="textile-view textile-side"><img src="assets/garments-textured-sprites.png" alt="'+name+'斜侧面" draggable="false"></span><span class="textile-view textile-front"><img src="assets/garments-textured-sprites.png" alt="'+name+'正面" draggable="false"></span></span><span class="garment-name">'+name+'</span>';const asset=rowIndex<2?window.GARMENT_VIEWS?.[rowIndex*6+i]:null;if(asset){item.classList.add('generated-garment');item.dataset.garmentId=asset.id;item.querySelector('.textile-side img').src=asset.views.side;item.querySelector('.textile-side img').alt=asset.name+'侧面';item.querySelector('.textile-front img').src=asset.views.front;item.querySelector('.garment-name').textContent=asset.name;for(const [view,url] of Object.entries(asset.views))item.dataset[view]=url;}item.style.setProperty('--sprite-x',(-i*100)+'%');const spriteRows=[0,-96,-192,-289,-386,-484];item.style.setProperty('--sprite-front-y',spriteRows[rowIndex*2]+'%');item.style.setProperty('--sprite-side-y',spriteRows[rowIndex*2+1]+'%');item.addEventListener('pointerenter',event=>{if(event.pointerType!=='touch')open(item)});item.addEventListener('pointerleave',event=>{if(event.pointerType!=='touch')close(item)});item.addEventListener('focus',()=>{if(item.matches(':focus-visible'))open(item)});item.addEventListener('blur',()=>close(item));item.onclick=event=>{if(event.pointerType==='mouse'){open(item);return}if(item.classList.contains('front-facing'))close(item);else open(item)};let itemDrag=null,blockClick=false;item.addEventListener('pointerdown',event=>{if(event.button!==0)return;itemDrag={id:event.pointerId,x:event.clientX,y:event.clientY,scroll:track.scrollLeft,moved:false};blockClick=false});item.addEventListener('pointermove',event=>{if(!itemDrag)return;const dx=event.clientX-itemDrag.x,dy=event.clientY-itemDrag.y;if(!itemDrag.moved&&Math.abs(dx)>6&&Math.abs(dx)>Math.abs(dy)){itemDrag.moved=true;blockClick=true;if(expanded)close(expanded);item.setPointerCapture(event.pointerId);track.classList.add('rail-dragging')}if(itemDrag.moved){event.preventDefault();track.scrollLeft=itemDrag.scroll-dx}});function stopItemDrag(event){if(!itemDrag)return;itemDrag=null;track.classList.remove('rail-dragging');if(item.hasPointerCapture(event.pointerId))item.releasePointerCapture(event.pointerId);setTimeout(()=>blockClick=false,200)}item.addEventListener('pointerup',stopItemDrag);item.addEventListener('pointercancel',stopItemDrag);item.addEventListener('click',event=>{if(blockClick){event.preventDefault();event.stopImmediatePropagation()}},true);item.addEventListener('dragstart',event=>event.preventDefault());track.append(item)});
let drag=null;handle.addEventListener('pointerdown',event=>{if(event.button!==0)return;drag={id:event.pointerId,x:event.clientX,scroll:track.scrollLeft};handle.setPointerCapture(event.pointerId);handle.classList.add('dragging');if(expanded)close(expanded);event.preventDefault()});handle.addEventListener('pointermove',event=>{if(!drag||event.pointerId!==drag.id)return;event.preventDefault();track.scrollLeft=drag.scroll-(event.clientX-drag.x)*1.4});function end(event){if(!drag)return;drag=null;handle.classList.remove('dragging');if(handle.hasPointerCapture(event.pointerId))handle.releasePointerCapture(event.pointerId)}handle.addEventListener('pointerup',end);handle.addEventListener('pointercancel',end);handle.addEventListener('lostpointercapture',()=>{drag=null;handle.classList.remove('dragging')});handle.addEventListener('keydown',event=>{if(['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();track.scrollBy({left:event.key==='ArrowRight'?110:-110,behavior:'smooth'})}});handle.addEventListener('wheel',event=>{const delta=Math.abs(event.deltaX)>Math.abs(event.deltaY)?event.deltaX:event.deltaY;if(delta){event.preventDefault();track.scrollLeft+=delta}},{passive:false});track.addEventListener('scroll',()=>{if(expanded&&drag)close(expanded)},{passive:true});section.append(handle,track);const hooks=document.createElement('div');hooks.className='continuous-rail-hooks';hooks.setAttribute('aria-hidden','true');const hookNodes=[...track.children].map(()=>{const hook=document.createElement('span');hook.innerHTML='<svg viewBox="0 0 16 40"><path d="M3 9C3 1 13 1 13 8c0 5-5 5-5 11v20"/></svg>';hooks.append(hook);return hook});section.append(hooks);host.append(section);function alignHooks(){[...track.children].forEach((item,index)=>{hookNodes[index].style.left=(track.offsetLeft+item.offsetLeft+item.offsetWidth/2-track.scrollLeft-8)+'px'})}track.addEventListener('scroll',alignHooks,{passive:true});const hookObserver=new ResizeObserver(alignHooks);hookObserver.observe(track);[...track.children].forEach(item=>hookObserver.observe(item));requestAnimationFrame(alignHooks)});const hint=document.createElement('p');hint.className='rail-hint';hint.textContent='悬停衣物看正面 · 拖动上方横杆左右浏览';host.append(hint)}
