ht:386px;border:3px solid #65567e;border-radius:22px;background:#f3eef7;position:relative;overflow:hidden;box-shadow:inset 0 -30px #e4d9eb}.glass:before{content:'';position:absolute;left:12px;top:64px;width:5px;height:85px;background:#fff9;border-radius:5px}.rail{position:absolute;left:20px;right:20px;top:25px;height:6px;border:2px solid #847098}.claw{position:absolute;z-index:5;left:50%;top:25px;transform:translateX(-50%);transition:left .4s;width:64px}.motor{position:absolute;top:-6px;left:14px;border:2px solid #65567e;border-radius:6px;background:#bed1af;width:36px;height:15px}.cable{height:50px;width:3px;background:#65567e;margin:auto;transition:height .7s}.claw.down .cable{height:240px}.claw svg{width:64px;height:50px;overflow:visible}.claw path{transition:transform .3s}.claw.closed .l{transform:rotate(-24deg);transform-origin:32px 8px}.claw.closed .r{transform:rotate(24deg);transform-origin:32px 8px}.cards{position:absolute;top:135px;left:12px;right:12px;height:220px}.card{position:absolute;left:var(--x);top:var(--y);transform:rotate(var(--r));width:102px;height:51px;border:1.5px solid #b8a7bf;background:#fff8ea;border-radius:12px;box-shadow:0 4px #8b729a20;font-size:13px;transition:opacity .3s}.card:nth-child(3n+1){background:#e4eadc}.card:nth-child(3n+2){background:#f2d9d4}.card.selected{border:2px solid #547568;box-shadow:0 0 0 4px #819e7725}.card.selected:after{content:'✓';position:absolute;right:-5px;top:-9px;background:#547568;color:white;border-radius:50%;width:19px;height:19px;font-size:11px;line-height:19px}.card.caught{opacity:0!important;pointer-events:none}.base{display:flex;justify-content:space-between;align-items:center;margin-top:20px}.plaque{border:2px solid #65567e;border-radius:11px;background:#fbf3df;padding:14px 12px;font-size:9px;letter-spacing:1px}.vents{letter-spacing:4px}.exit{border:6px solid #65567e;background:#7c6698;border-radius:12px;color:#e5daec;font-size:10px;padding:12px}.feet{display:flex;justify-content:space-between;padding:0 32px}.feet i{height:15px;width:52px;background:#65567e;border-radius:0 0 9px 9px}.controls{display:flex;gap:16px;justify-content:center;margin-top:27px}.controls button{border:2px solid #65567e;border-radius:20px;box-shadow:0 5px #65567e;background:#e9dff0;font-size:26px;width:72px;height:60px}.controls .catch{width:190px;font-size:18px;letter-spacing:2px;background:#f1c4b3}.controls button:active{transform:translateY(4px);box-shadow:0 1px #65567e}.hint{font-size:10px;letter-spacing:1px;text-align:center;color:#94869d;margin:22px 0 0}.collection{border-top:1px solid #ddd5c8;padding-top:18px;font-size:12px}.collection p{color:#536f63}footer{text-align:center;font-size:10px;letter-spacing:3px;color:#aaa18f;margin:30px}.hide{display:none!important}@media(max-width:740px){header{padding:22px}.brand{font-size:18px}main{display:flex;flex-direction:column;gap:22px;margin-top:0;padding:0 20px}.intro{text-align:center;width:100%}.flower{display:none}h1{font-size:27px;margin:7px 0}.intro p{margin:7px 0}.tags{justify-content:center;margin:14px 0 8px;min-height:0}.status{margin-top:12px;min-height:25px}.machine{max-width:430px}.card{width:90px;font-size:12px}.body{padding:26px 14px 18px}.sign{padding:17px 5px}.sign strong{font-size:21px}.glass{height:378px}.collection{margin-top:14px}.caption{font-size:10px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><header><div class="brand">OOTRIP</div><div class="step"><span id="step">风格偏好 · 2 / 5</span><div class="line"><i id="progress"></i></div></div></header><main><section class="intro"><div class="flower">✳</div><span class="caption">把心动的风格，装进口袋</span><h1 id="title">今天，想穿成<br>哪一种自己？</h1><p id="desc">轻点抓夹下的风格卡，可多选。<br>让一点小小的心动，决定今天的穿搭。</p><div class="tags" id="tags"></div><div id="actions"><button class="primary" id="start" disabled>选好了，去抓取 ↗</button><button class="quiet" id="clear">清空选择</button></div><div class="status" id="status" role="status" aria-live="polite">试试「极简」与「韩系温柔」</div><div class="collection hide" id="collection">我的风格口袋 <span id="count"></span><p id="pocket">等待第一份心动…</p><button class="quiet" id="reset">重新选择风格</button></div></section><section class="machine" aria-label="风格娃娃机"><div class="sign"><small>A LITTLE STYLE, A LITTLE YOU</small><strong id="sign">风格心动收集站</strong></div><div class="body"><div class="glass"><div class="rail"></div><div class="claw" id="claw"><div class="motor"></div><div class="cable"></div><svg viewBox="0 0 64 50" fill="none" stroke="#65567e" stroke-width="3" stroke-linecap="round"><circle cx="32" cy="9" r="9" fill="#f2c7b6"/><path class="l" d="M25 14 9 31 14 43 23 37"/><path class="r" d="m39 14 16 17-5 12-9-6"/><path d="M32 19v19"/></svg></div><div class="cards" id="cards"></div></div><div class="base"><span class="plaque">PICK YOUR LITTLE JOY</span><b class="vents">▎▎▎</b><span class="exit">风格出口</span></div></div><div class="feet"><i></i><i></i></div><div class="controls hide" id="controls"><button id="left" aria-label="向左移动">←</button><button class="catch" id="catch">抓住心动</button><button id="right" aria-label="向右移动">→</button></div><p class="hint" id="hint">散落的每一张卡，都是一种可能的你</p></section></main><footer>OOTRIP / FIND YOUR EVERYDAY MOOD</footer><script>
const names=['极简','韩系温柔','甜美少女','运动休闲','美式街头','千禧辣妹','暗黑酷飒','轻奢知性','法式复古','日系自然','山系机能','波西米亚'],icons=['◇','✿','♡','↗','☆','✦','☾','♧','❦','❀','△','☼'],pos=[[3,4,-9],[62,8,8],[33,27,-5],[0,45,5],[65,49,-8],[30,64,9],[3,85,-7],[62,91,5],[34,106,-4],[0,129,6],[64,137,-6],[31,156,5]];let selected=new Set(),caught=new Set(),playing=false,busy=false,x=50;const $=id=>document.getElementById(id);function draw(){$('cards').replaceChildren();names.forEach((n,i)=>{let b=document.createElement('button');b.className='card'+(selected.has(n)?' selected':'')+(caught.has(n)?' caught':'');b.textContent=icons[i]+' '+n;b.style.cssText=`--x:${pos[i][0]}%;--y:${pos[i][1]}px;--r:${pos[i][2]}deg`;b.setAttribute('aria-pressed',selected.has(n));if(playing){b.style.opacity=selected.has(n)?'1':'.18';b.disabled=true}b.onclick=()=>{selected.has(n)?selected.delete(n):selected.add(n);draw();update()};$('cards').append(b)})}function update(){$('tags').innerHTML=[...selected].map(n=>`<span class="tag">${n}</span>`).join('');$('start').disabled=!selected.size;$('count').textContent=caught.size+' / '+selected.size;$('pocket').textContent=caught.size?[...caught].join(' · '):'等待第一份心动…'}$('clear').onclick=()=>{selected.clear();draw();update()};$('start').onclick=()=>{playing=true;$('title').innerHTML='喜欢的风格，<br>亲手抓住。';$('desc').innerHTML='左右移动抓夹，靠近你喜欢的卡片。<br>每一次抓取，都收获一种心动。';$('actions').classList.add('hide');$('controls').classList.remove('hide');$('collection').classList.remove('hide');$('status').textContent='准备好了吗？移动抓夹，开始收集';$('step').textContent='收集心动 · 3 / 5';$('progress').style.width='60%';$('sign').textContent='抓住你的穿搭灵感';$('hint').textContent='← → 移动抓夹 · 空格抓取';draw();update()};function move(d){if(!playing||busy)return;x=Math.max(12,Math.min(88,x+d));$('claw').style.left=x+'%'}$('left').onclick=()=>move(-12);$('right').onclick=()=>move(12);const pause=ms=>new Promise(r=>setTimeout(r,ms));async function grab(){if(!playing||busy||caught.size===selected.size)return;busy=true;$('catch').disabled=true;let target=names.filter(n=>selected.has(n)&&!caught.has(n)).sort((a,b)=>Math.abs(pos[names.indexOf(a)][0]+12-x)-Math.abs(pos[names.indexOf(b)][0]+12-x))[0];x=Math.min(88,pos[names.indexOf(target)][0]+12);$('claw').style.left=x+'%';$('status').textContent='瞄准「'+target+'」，抓夹出发…';await pause(450);$('claw').classList.add('down');await pause(750);$('claw').classList.add('closed');await pause(350);caught.add(target);draw();$('claw').classList.remove('down');await pause(750);$('claw').classList.remove('closed');update();$('status').textContent=caught.size===selected.size?'收集完成！你喜欢的风格，都在口袋里了。':'抓到「'+target+'」！继续收集下一份心动';$('catch').textContent=caught.size===selected.size?'收集完成 ✓':'抓住心动';busy=false;$('catch').disabled=caught.size===selected.size}$('catch').onclick=grab;$('reset').onclick=()=>{if(busy)return;playing=false;caught.clear();$('title').innerHTML='今天，想穿成<br>哪一种自己？';$('desc').innerHTML='轻点抓夹下的风格卡，可多选。<br>让一点小小的心动，决定今天的穿搭。';$('actions').classList.remove('hide');$('controls').classList.add('hide');$('collection').classList.add('hide');$('step').textContent='风格偏好 · 2 / 5';$('progress').style.width='40%';$('sign').textContent='风格心动收集站';$('status').textContent='重新挑选你的心动风格';$('hint').textContent='散落的每一张卡，都是一种可能的你';$('catch').disabled=false;$('catch').textContent='抓住心动';draw();update()};document.addEventListener('keydown',e=>{if(!playing)return;if(e.target.tagName==='BUTTON'&&e.key===' ')return;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')move(-12);if(e.key==='ArrowRight')move(12);if(e.key===' ')grab()});draw();
</script></html>
