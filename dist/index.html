function showStyleForm(){document.body.classList.add('style-form-mode');$('style-form').classList.remove('hide');$('style-form').innerHTML=`<div class="trip-head"><strong>OOTRIP</strong><span>2 / 5</span></div><div class="trip-progress"><i style="width:40%"></i></div><h2>您喜欢哪些穿衣风格？</h2><p class="trip-desc">每次回答一题，所有问题均需完成。</p><div class="style-grid" id="style-grid"></div><div class="trip-actions"><button id="style-prev">上一题</button><button id="style-clear">清空本题</button></div><button class="trip-next" id="style-next">选好了，下一步</button>`;$('style-grid').replaceChildren();names.forEach(name=>{const b=document.createElement('button');b.className='style-choice';b.textContent=name;b.setAttribute('aria-pressed',caught.has(name));b.onclick=()=>{if(caught.has(name)){caught.delete(name);selected.delete(name)}else{caught.add(name);selected.add(name)}b.setAttribute('aria-pressed',caught.has(name));$('style-next').disabled=!caught.size};$('style-grid').append(b)});$('style-next').disabled=!caught.size;$('style-next').onclick=()=>{if(caught.size)showTrip(3)};$('style-clear').onclick=()=>{caught.clear();selected.clear();showStyleForm()};$('style-prev').onclick=()=>{document.body.classList.remove('style-form-mode');$('style-form').classList.add('hide');document.body.classList.add('age-mode');$('age-page').classList.remove('hide')};document.querySelector('.phone-screen').scrollTop=0}
</script></html>
